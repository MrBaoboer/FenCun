name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 与 package.json 的 engines.node 同一个大版本。那边是 Vercel 实际用的那条
          # （engines.node 覆盖项目面板设置），这里跟着它走，CI 与生产才是同一个运行时。
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency audit
        # 全树审计 + 逐条具名豁免（清单与理由在 scripts/audit-gate.mjs）。
        # 上一版是整棵开发依赖树的匿名豁免：理由窄、手段宽——往后 tsx、puppeteer-core、
        # 任意 eslint 插件里出现新的 high/critical 都会照样绿灯，而且没人会注意到。
        run: node scripts/audit-gate.mjs
      - name: Lint
        run: npm run lint
      - name: Test (engine unit tests)
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  reuse:
    name: reuse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 每个文件都要带版权与许可标注。整站被抄走时能走 GitHub DMCA，前提是「我的声明
      # 被移除了」拿得出证据；声明只写在根目录 LICENSE 里，复制一个 src/ 就绕开了。
      # 覆盖规则见 REUSE.toml，数据目录的单独条款见 LICENSES/。
      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Scan the complete reachable history so force-pushes and root commits do not
      # depend on an event-derived `before^..after` range.
      - name: Gitleaks (full history)
        # Dependabot 的 github-actions 生态不跟进 `docker://` 引用——这个摘要在 v8.24.3
        # 上停了半年没人推，是手动核对上游 release 后换的。改版本时记得一起改注释里的 tag。
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --verbose .
