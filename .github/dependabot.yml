version: 2
updates:
  # npm 依赖：每周检查，minor / patch 全部收进**一条** PR。
  #
  # 分组按「要不要人看」切，不按用途切。上一版分了 framework / types / dev-tooling 三组，
  # 再加上没被任何 pattern 命中的依赖（zustand、zod、minisearch 各自单开），一次周更能吐出
  # 四五条 PR——而其中改 package-lock.json 的那几条必然互相顶：先合一条，其余全部待 rebase。
  #
  # 现在只有两类：minor / patch 攒成一条，CI 绿了直接点合并；major 不进组，各自单开一条 PR，
  # 逼你正眼看一遍。原来「Next / React 的 major 需人工审回归，勿盲合」那条纪律没有放松，
  # 反而从三个包扩到了全部依赖。
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # 安全更新走另一条通道：由公告触发，不看 schedule。不分组的话，同时爆两个公告
      # 就是两条 PR。
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # 只挡 major，minor / patch 照常跟进。
      #
      # eslint / typescript 的 major 由 eslint-config-next 那串内置插件的 peer 范围决定，
      # 不是我们能选的。想解禁就去核这两组声明，达标了手动升，别等 Dependabot：
      #   eslint 10    ← eslint-plugin-react 7.37.5 / eslint-plugin-import 2.32.0 /
      #                  eslint-plugin-jsx-a11y 6.10.2 的 peer 都封顶在 9（react 那条是 ^9.7）
      #   typescript 7 ← typescript-eslint 8.66.0 的 peer 是 >=4.8.4 <6.1.0；7.x 是原生编译器，
      #                  typescript-eslint 在模块加载时就 throw，lint 连启动都做不到。
      #   ⚠️ 别信 npm 的 dist-tag：typescript 的 `beta` 至今指向 6.0.0-beta，看上去像「6.x 还没
      #      正式版」，而 6.0.2 / 6.0.3 早已正式发布。查可用版本用 `npm view typescript versions`。
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node 跟随运行时大版本，不跳到领先运行时的那一版——那会拿到当前 Node 上并不存在
      # 的 API 类型。运行时升级要一起动的六处：package.json 的 engines.node、ci.yml 的
      # node-version、本条 ignore，以及 README「本地运行」与两份 CONTRIBUTING 的「本地开发」。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # 保持 CI 里钉了 SHA 的第三方 Action 也能被跟进更新。
  #
  # 换成月更是因为它跨不过生态边界：Dependabot 的分组只在单个 updates 条目内生效，npm 与
  # github-actions 永远是两条 PR。Action 的 SHA 一个月挪一两次，跟 npm 挤在同一周只是白白
  # 多一条 PR；错开之后，多数周只有一条 npm PR 要点。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
